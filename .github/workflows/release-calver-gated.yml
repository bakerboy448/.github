---
name: Release (calver, gated)

"on":
  workflow_call:
    inputs:
      sha:
        description: Commit SHA whose validation workflow runs are checked
        type: string
        required: true
      required_workflows:
        description: Comma-separated workflow file names that run on every push and must have succeeded for the SHA
        type: string
        required: true
      optional_workflows:
        description: Comma-separated workflow file names that are path-filtered; a run is inapplicable when absent but must succeed when present
        type: string
        default: ""
      prerelease:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gate:
    name: Validation gate
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha }}
          REQUIRED: ${{ inputs.required_workflows }}
          OPTIONAL: ${{ inputs.optional_workflows }}
        run: |
          set -euo pipefail
          ready=true
          state() {
            gh api "repos/$REPO/actions/workflows/$1/runs?head_sha=$SHA&event=push&per_page=100" \
              --jq '.workflow_runs | if length == 0 then "none" else (sort_by(.created_at) | last | "\(.status) \(.conclusion)") end'
          }
          for f in ${REQUIRED//,/ }; do
            s="$(state "$f")"; echo "required $f: $s"
            [ "$s" = "completed success" ] || ready=false
          done
          for f in ${OPTIONAL//,/ }; do
            s="$(state "$f")"; echo "optional $f: $s"
            case "$s" in "none"|"completed success") ;; *) ready=false ;; esac
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          [ "$ready" = true ] || echo "Not ready; a later workflow completion re-evaluates this SHA."

  release:
    name: Publish calver release
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    permissions:
      contents: write
    uses: bakerboy448/.github/.github/workflows/release-calver.yml@625cd5467e2b71e44d10f06697535abca356f842
    with:
      sha: ${{ inputs.sha }}
      prerelease: ${{ inputs.prerelease }}
