---
name: Pre-commit

"on":
  workflow_call:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: [self-hosted, Linux, X64, hetzner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.6"

      # pre-commit/action saves ~/.cache/pre-commit to the GitHub cache, which on
      # these shared runners was about 2.7 GB per ref. The hook cache already
      # persists on the runner disk, so run pre-commit directly.
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.5.1

      - name: Run pre-commit
        run: pre-commit run --show-diff-on-failure --color=always --all-files
        env:
          SKIP: no-commit-to-branch
